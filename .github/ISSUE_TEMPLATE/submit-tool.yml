name: Submit a tool
description: Submit an AI tool for a free ToolRank listing (editorial review, inclusion not guaranteed).
title: "Submit tool: "
labels: ["submission"]
body:
  - type: input
    id: name
    attributes: {label: Tool name}
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: Tool URL, placeholder: "https://"}
    validations: {required: true}
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "Best for vibe coding"
        - "Best coding assistants"
        - "Best for video"
        - "Best agent builder"
        - "Best for image generation"
        - "Best for writing"
        - "Best for research & search"
        - "Best for voice & audio"
        - "Best for productivity & automation"
        - "Other / new category"
    validations: {required: true}
  - type: input
    id: desc
    attributes: {label: One-line description}
    validations: {required: true}
  - type: dropdown
    id: pricing
    attributes: {label: Pricing, options: [free, freemium, paid]}
    validations: {required: true}
  - type: input
    id: email
    attributes: {label: Contact email, description: "Visible publicly on this issue."}
    validations: {required: true}
