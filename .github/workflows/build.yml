name: Build reviews
on:
  schedule:
    - cron: "17 * * * *"
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: build-reviews
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site (fetches approved reviews)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          REVIEWS_REQUIRED: "1"
        run: python3 scripts/build.py
      - name: Check
        run: python3 scripts/check.py --no-external
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update reviews ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase
          git push
